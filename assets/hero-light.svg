  <rect x="0" y="0" width="1200" height="300" rx="14" fill="none" stroke="#d0d7de"/>

  <!-- left: identity -->
  <text x="60" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0e7c6b">~/b1ll1eee</text>
  <text x="58" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1f2328" letter-spacing="-0.5">Krirk Klomkliang</text>
  <text x="60" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#656d76">Full-stack developer. Go on the server, Vue &amp; Next.js on the screen.</text>

  <rect x="60" y="204" width="142" height="26" rx="13" fill="none" stroke="#d0d7de"/><text x="131.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#656d76">real-time chat</text>
  <rect x="212" y="204" width="94" height="26" rx="13" fill="none" stroke="#d0d7de"/><text x="259.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#656d76">payments</text>
  <rect x="316" y="204" width="134" height="26" rx="13" fill="none" stroke="#d0d7de"/><text x="383.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#656d76">sms pipelines</text>
  <rect x="460" y="204" width="110" height="26" rx="13" fill="none" stroke="#d0d7de"/><text x="515.0" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#656d76">local LLMs</text>
  <text x="60" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8c959f">Bangkok, Thailand · open to backend / full-stack work</text>

  <!-- right: terminal -->
  <rect x="700" y="44" width="450" height="212" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="722" cy="62" r="5" fill="#cf222e"/>
  <circle cx="740" cy="62" r="5" fill="#b7791f"/>
  <circle cx="758" cy="62" r="5" fill="#1a7f37"/>
  <text x="925" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8c959f">zsh — scribe-api</text>
  <line x1="700" y1="78" x2="1150" y2="78" stroke="#d0d7de"/>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.6s" fill="freeze"/><text x="730" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#0e7c6b">$</text><text x="748" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1f2328">whoami</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.1s" fill="freeze"/><text x="748" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#656d76">bill · bangkok, th</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.8s" fill="freeze"/><text x="730" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#0e7c6b">$</text><text x="748" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1f2328">go run ./cmd/api</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.3s" fill="freeze"/><text x="748" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#656d76">api listening on :8090</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.2s" fill="freeze"/><text x="730" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#0e7c6b">$</text><text x="748" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1f2328">tail -f api.log | grep ERROR</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.9s" fill="freeze"/><text x="748" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8c959f">— nothing yet. good.</text><rect x="938" y="211" width="9" height="17" fill="#0e7c6b"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="4s" repeatCount="indefinite"/></rect></g>
