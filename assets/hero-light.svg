<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Krirk Klomkliang, full-stack developer, Bangkok">
  <rect width="1200" height="240" fill="#ffffff"/>
  <!-- frame -->
  <rect x="0.5" y="0.5" width="1199" height="239" fill="none" stroke="#e3e7ec"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#e3e7ec"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#e3e7ec"/>
  <line x1="820" y1="40" x2="820" y2="200" stroke="#e3e7ec"/>

  <!-- top rail -->
  <text x="24" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9aa3ad" text-anchor="start" letter-spacing="3">B1LL1EEE</text>
  <text x="300" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9aa3ad" text-anchor="start" letter-spacing="3">FULL-STACK DEVELOPER</text>
  <text x="1176" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9aa3ad" text-anchor="end" letter-spacing="2">BANGKOK · 13.75N 100.50E</text>

  <!-- name -->
  <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#1f2328" letter-spacing="-0.5">Krirk Klomkliang</text>
  <text x="26" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#656d76">Go on the server. Vue and Next.js on the screen. Boring in production, on purpose.</text>

  <!-- status panel -->
  <text x="844" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa3ad" text-anchor="start" letter-spacing="3">STATUS</text>
  <circle cx="850" cy="99" r="4" fill="#0891b2">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="99" r="4" fill="none" stroke="#0891b2" stroke-width="1">
    <animate attributeName="r" values="4;11" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="866" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2328" text-anchor="start" letter-spacing="0">building real-time chat + sms platform</text>
  <text x="844" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa3ad" text-anchor="start" letter-spacing="3">STACK</text>
  <text x="844" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2328" text-anchor="start" letter-spacing="0">go · typescript · python</text>
  <text x="1050" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa3ad" text-anchor="start" letter-spacing="3">SINCE</text>
  <text x="1050" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2328" text-anchor="start" letter-spacing="0">2023</text>
  <text x="1118" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa3ad" text-anchor="start" letter-spacing="3">OPEN TO</text>
  <text x="1118" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#1f2328" text-anchor="start" letter-spacing="0">backend</text>

  <!-- bottom rail with scanner -->
  <rect x="0" y="200" width="1200" height="39" fill="none"/>
  <line x1="24" y1="220" x2="1176" y2="220" stroke="#e3e7ec"/>
  <rect x="24" y="219" width="90" height="2" fill="#0891b2" opacity="0.9">
    <animate attributeName="x" values="24;1086;24" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>
  <text x="24" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#9aa3ad" text-anchor="start" letter-spacing="3">SYS</text>
  <text x="1176" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#9aa3ad" text-anchor="end" letter-spacing="2">v2026.10</text>
</svg>
