  <text x="1176" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9aa3ad" text-anchor="end" letter-spacing="3">GO · PORTS &amp; ADAPTERS</text>
