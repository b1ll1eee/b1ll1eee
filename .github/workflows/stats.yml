name: Refresh activity strip

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC (07:17 Bangkok)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_stats.py ${{ github.repository_owner }} data/stats.json
      - name: Regenerate SVGs
        run: python3 scripts/gen_assets.py assets
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "stats: refresh activity strip ($(date -u +%Y-%m-%d))"
          git push
